name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 本仓
        uses: actions/checkout@v7
        with:
          path: PluginManager

      # 核心按 ../.. 找契约与 McMaster fork；并列摆放才能编到源码。
      - name: 契约
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions

      - name: McMaster fork
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/Hosihikari.McMaster.NETCore.Plugins
          path: McMaster.NETCore.Plugins

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 版本
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 打包
        working-directory: PluginManager
        run: bash ./pack.sh "${{ steps.version.outputs.version }}"

      - name: 检查附件形状
        working-directory: PluginManager
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          zip="artifacts/hosihikari-core-$VERSION.zip"
          unzip -l "$zip" | grep -q 'plugins/hosihikari/Hosihikari.PluginManager.dll'
          test "$(unzip -p "$zip" sei.json | jq -r .name)" = hosihikari
          test "$(unzip -p "$zip" sei.json | jq -r .version)" = "$VERSION"
          test "$(unzip -p "$zip" sei.json | jq -r .layout)" = root

      - name: 发 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            PluginManager/artifacts/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --generate-notes

      # 发布后把这一版作为 sei 提交给官方索引。索引仓在另一个仓库，
      # GITHUB_TOKEN 出不去，所以用 SEI_SUBMISSION_TOKEN；没配就跳过，不让发版失败。
      - name: 提交 SeiIndex
        env:
          GH_TOKEN: ${{ secrets.SEI_SUBMISSION_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NAME: hosihikari
          INDEX_REPO: Hosihikari/SeiIndex
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::SEI_SUBMISSION_TOKEN 未配置，跳过 SeiIndex 提交"
            exit 0
          fi

          asset="hosihikari-core-$VERSION.zip"
          file="PluginManager/artifacts/$asset"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$asset"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          size=$(wc -c < "$file")
          title="[sei] $NAME $VERSION"

          # 重跑工作流时不再开第二个 issue。
          existing=$(gh issue list --repo "$INDEX_REPO" --state all --limit 200 \
            --json title --jq '.[].title' | grep -Fxc "$title" || true)
          if [ "$existing" != "0" ]; then
            echo "::notice::SeiIndex already has an issue titled '$title'"
            exit 0
          fi

          body=$(cat <<EOF
          ### Sei name

          $NAME

          ### Version entry (JSON)

          \`\`\`json
          {
            "version": "$VERSION",
            "dependencies": [],
            "artifacts": [
              {
                "layout": "root",
                "source": {
                  "url": "$url",
                  "sha256": "$sha",
                  "size": $size
                }
              }
            ]
          }
          \`\`\`
          EOF
          )

          gh issue create --repo "$INDEX_REPO" --title "$title" --body "$body"

  # 核心同时以 NuGet 包发布，供 Testing/工具链引用。Release 附件与 NuGet 共用 v* 标签，
  # 但各自校验自己的版本事实源。
  nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 换 OIDC 令牌（Trusted Publishing）

    steps:
      - name: 本仓
        uses: actions/checkout@v7
        with:
          path: PluginManager

      - name: 契约
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions

      - name: McMaster fork
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/Hosihikari.McMaster.NETCore.Plugins
          path: McMaster.NETCore.Plugins

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 版本一致
        shell: pwsh
        working-directory: PluginManager
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $version = dotnet msbuild src/Hosihikari.PluginManager.csproj -getProperty:PackageVersion
          if ($version -ne $tag) { throw "PackageVersion 是 $version，标签是 $tag" }

      - name: 打包核心
        working-directory: PluginManager
        run: dotnet pack src/Hosihikari.PluginManager.csproj -c Release -o out --nologo

      - name: 打包作者工具
        working-directory: PluginManager
        run: |
          dotnet pack tools/Build/Hosihikari.Plugin.Build.csproj -c Release -o out --nologo
          dotnet pack testing/Hosihikari.Testing/Hosihikari.Testing.csproj -c Release -o out --nologo

      # 换来的 key 只有一小时有效期，所以登录紧贴推送。
      - name: 换临时 API key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 推送
        working-directory: PluginManager
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
