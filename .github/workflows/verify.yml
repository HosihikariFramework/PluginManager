name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assertions:
    runs-on: ubuntu-latest
    steps:
      - name: 本仓
        uses: actions/checkout@v7
        with:
          path: PluginManager

      # 契约与核心一起改：并列摆放才能编到新契约；单独 clone 仍可走 nuget.org 的包。
      - name: 契约
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          # 配对的契约 PR 分支：新 API 还没发布。
          ref: feat/shared-list-and-templates
          path: Plugin.Abstractions

      # 本机库的 RID 优先解析需要 fork；核心按 ../.. 找它。
      - name: McMaster fork
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/DotNetCorePlugins
          path: DotNetCorePlugins

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 宿主把整份断言清单跑一遍，任一条不过就以非零退出 —— 门槛就在这里（ADR-0015）。
      # 这里不写条数：它会变，而写死的数字只会变成下一处过时的注释。
      - name: 跑断言
        working-directory: PluginManager
        run: dotnet run --project host/Hosihikari.PluginManager.Host.csproj -c Release

      # MSBuild 打包包：PackPlugin 目标在一次性插件项目上跑通。
      - name: MSBuild 打包包冒烟
        working-directory: PluginManager
        run: bash tools/Build/smoke.sh

      # 打包器同时作为 dotnet 工具分发；确认它能打成工具并装得起来。
      - name: 打包器工具冒烟
        working-directory: PluginManager
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hosihikari-pack-tool"
          dotnet pack tools/Pack/Hosihikari.Plugin.Pack.csproj -c Release -o "$out" --nologo
          cat > "$out/NuGet.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration><packageSources><clear /><add key="local" value="$out" /></packageSources></configuration>
          EOF
          dotnet tool install --tool-path "$out/bin" --configfile "$out/NuGet.config" \
            Hosihikari.Plugin.Pack --version 1.1.0
          # 用法信息的退出码是 2；能打印出来就说明工具可运行。
          "$out/bin/hosihikari-pack" --help || test $? -eq 2

      # 作者测试包：内存上下文、手动调度与生命周期宿主。
      - name: Testing 包冒烟
        working-directory: PluginManager
        run: dotnet run --project testing/Hosihikari.Testing.Smoke/Hosihikari.Testing.Smoke.csproj -c Release

      # 核心包本身也过一遍打包，避免发布时才暴露形状问题。
      - name: 打包检查
        working-directory: PluginManager
        run: |
          set -euo pipefail
          bash ./pack.sh 0.0.0-check
          unzip -l artifacts/hosihikari-core-0.0.0-check.zip | grep -q 'plugins/hosihikari/Hosihikari.PluginManager.dll'
          unzip -l artifacts/hosihikari-core-0.0.0-check.zip | grep -q 'plugins/hosihikari/Hosihikari.PluginManager.runtimeconfig.json'
          unzip -l artifacts/hosihikari-core-0.0.0-check.zip | grep -q 'plugins/hosihikari/NuGet.Versioning.dll'
          test "$(unzip -p artifacts/hosihikari-core-0.0.0-check.zip sei.json | jq -r .name)" = hosihikari
          test "$(unzip -p artifacts/hosihikari-core-0.0.0-check.zip sei.json | jq -r .version)" = 0.0.0-check
          test "$(unzip -p artifacts/hosihikari-core-0.0.0-check.zip sei.json | jq -r .schemaVersion)" = 2
          test "$(unzip -p artifacts/hosihikari-core-0.0.0-check.zip sei.json | jq -r .artifact.layout)" = root
