name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: 格式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 仓里的配置文件与 FormatterConfig 逐字节相同，是标准；漂了就停下并打印 diff。
      # clang-format 版本钉死：新版本认不全新选项，--Werror 会把未知项也算失败。
      - name: C/C++
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(
            git ls-files -z -- '*.c' '*.cpp' '*.h' '*.hpp' | grep -zvE '/(build|bin|obj)/'
          )
          if [ ${#files[@]} -eq 0 ]; then echo "没有 C/C++ 文件"; exit 0; fi
          python3 -m venv "$RUNNER_TEMP/cf"
          "$RUNNER_TEMP/cf/bin/pip" install --quiet 'clang-format==23.1.4'
          "$RUNNER_TEMP/cf/bin/clang-format" --dry-run --Werror "${files[@]}"

      # .clang-format 管不到的规则由 .editorconfig 规定，这里查它 —— clang-format 不看
      # .editorconfig。行尾不查：检出是 CRLF、索引里是 LF，先把 CR 去掉再判行尾空白。
      - name: 空白
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files)
          fail=0
          for f in "${files[@]}"; do
            [ -s "$f" ] || continue
            if [ -n "$(tail -c 1 "$f")" ]; then
              echo "$f: 文件末尾缺换行"; fail=1
            fi
            if sed 's/\r$//' "$f" | grep -qE '[[:space:]]+$'; then
              echo "$f: 有行尾空白"; fail=1
            fi
          done
          exit "$fail"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # .editorconfig 里的 csharp_* 规则只有 dotnet format 会执行。只放 whitespace：
      # style 那套会连 file_header_template 一起要求。
      - name: C# 空白
        run: |
          set -euo pipefail
          sln=$(git ls-files -- '*.slnx' '*.sln' | head -n 1)
          if [ -z "$sln" ]; then echo "没有解决方案文件"; exit 0; fi
          dotnet format whitespace "$sln" --verify-no-changes
  assertions:
    runs-on: ubuntu-latest
    steps:
      # 并列检出：依赖仓若也有同名分支就用它（同批改动），否则跟目标分支。
      - name: 解析依赖仓的 ref
        id: depref
        env:
          BRANCH: ${{ github.head_ref || '' }}
          FALLBACK: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          resolve() {
            if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "https://github.com/$1.git" "$BRANCH" >/dev/null 2>&1; then
              printf '%s' "$BRANCH"
            else
              printf '%s' "$FALLBACK"
            fi
          }
          echo "PluginAbstractions=$(resolve HosihikariFramework/PluginAbstractions)" >> "$GITHUB_OUTPUT"
          echo "DotNetCorePlugins=$(resolve HosihikariFramework/DotNetCorePlugins)" >> "$GITHUB_OUTPUT"
      - name: 本仓
        uses: actions/checkout@v7
        with:
          path: PluginManager

      # 契约与核心一起改：并列摆放才能编到新契约；单独 clone 仍可走 nuget.org 的包。
      - name: 契约
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions
          # ref 由上一步按「依赖仓有没有同名分支」解析（见 depref）。
          ref: ${{ steps.depref.outputs.PluginAbstractions }}

      # 本机库的 RID 优先解析需要 fork；核心按 ../.. 找它。
      - name: McMaster fork
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/DotNetCorePlugins
          path: DotNetCorePlugins
          ref: ${{ steps.depref.outputs.DotNetCorePlugins }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # 宿主把整份断言清单跑一遍，任一条不过就以非零退出 —— 门槛就在这里（FX-0015）。
      # 这里不写条数：它会变，而写死的数字只会变成下一处过时的注释。
      - name: 跑断言
        working-directory: PluginManager
        run: dotnet run --project host/Hosihikari.PluginManager.Host.csproj -c Release

      # MSBuild 打包包：PackPlugin 目标在一次性插件项目上跑通。
      - name: MSBuild 打包包冒烟
        working-directory: PluginManager
        run: bash tools/Build/smoke.sh

      # 打包器同时作为 dotnet 工具分发；确认它能打成工具并装得起来。
      - name: 打包器工具冒烟
        working-directory: PluginManager
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hosihikari-pack-tool"
          dotnet pack tools/Pack/Hosihikari.Plugin.Pack.csproj -c Release -o "$out" --nologo
          cat > "$out/NuGet.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration><packageSources><clear /><add key="local" value="$out" /></packageSources></configuration>
          EOF
          dotnet tool install --tool-path "$out/bin" --configfile "$out/NuGet.config" \
            Hosihikari.Plugin.Pack --version 1.1.0
          # 用法信息的退出码是 2；能打印出来就说明工具可运行。
          "$out/bin/hosihikari-pack" --help || test $? -eq 2

      # 作者测试包：内存上下文、手动调度与生命周期宿主。
      - name: Testing 包冒烟
        working-directory: PluginManager
        run: dotnet run --project testing/Hosihikari.Testing.Smoke/Hosihikari.Testing.Smoke.csproj -c Release

      # 核心包本身也过一遍打包，避免发布时才暴露形状问题。
      - name: 打包检查
        working-directory: PluginManager
        run: |
          set -euo pipefail
          bash ./pack.sh 0.0.0-check
          unzip -l artifacts/hosihikari-core-0.0.0-check.zip | grep -q 'plugins/hosihikari/Hosihikari.PluginManager.dll'
          unzip -l artifacts/hosihikari-core-0.0.0-check.zip | grep -q 'plugins/hosihikari/Hosihikari.PluginManager.runtimeconfig.json'
          unzip -l artifacts/hosihikari-core-0.0.0-check.zip | grep -q 'plugins/hosihikari/NuGet.Versioning.dll'
          test "$(unzip -p artifacts/hosihikari-core-0.0.0-check.zip sei.json | jq -r .name)" = hosihikari
          test "$(unzip -p artifacts/hosihikari-core-0.0.0-check.zip sei.json | jq -r .version)" = 0.0.0-check
          test "$(unzip -p artifacts/hosihikari-core-0.0.0-check.zip sei.json | jq -r .schemaVersion)" = 3
          test "$(unzip -p artifacts/hosihikari-core-0.0.0-check.zip sei.json | jq -r .artifact.layout)" = root
